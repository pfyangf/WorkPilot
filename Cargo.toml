[workspace]
resolver = "2"
members = ["crates/workpilot-domain", "crates/workpilot-contracts"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
